<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO - список задач</title>
  <meta name="description" content="Простой и аккуратный список задач с таймером." />
  <meta name="theme-color" content="#6366f1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>

  <div class="layout">
    
    <!-- ЛЕВАЯ КОЛОНКА -->
    <main class="app">
      <header class="app-header">
        <div>
          <h1>Мои задачи</h1>
          <p class="subtitle" id="subtitle">Всё под контролем</p>
        </div>
        <button id="themeToggle" class="icon-btn" aria-label="Сменить тему">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </header>

      <form class="add-form" id="addForm">
        <input type="text" id="taskInput" placeholder="Что нужно сделать?" autocomplete="off" maxlength="200" />
        <button type="submit" aria-label="Добавить задачу">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </form>

      <nav class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="active">Активные</button>
        <button class="filter-btn" data-filter="done">Выполненные</button>
      </nav>

      <ul class="task-list" id="taskList" aria-live="polite"></ul>

      <footer class="app-footer">
        <span id="counter">0 задач</span>
        <button id="clearDone" class="clear-btn" hidden>Очистить выполненные</button>
      </footer>
    </main>

    <!-- ПРАВАЯ КОЛОНКА: ТАЙМЕР -->
    <aside class="pomodoro-card">
      <div class="pomo-header">
        <h2 class="pomo-title">Таймер</h2>
        <span class="pomo-status" id="pomoMode">Фокус</span>
      </div>
      
      <div class="pomo-time-display" id="pomoTime">25:00</div>
      
      <div class="pomo-settings" id="pomoSettings">
        <label>
          Фокус (мин)
          <input type="number" id="setFocus" value="25" min="1" max="120">
        </label>
        <label>
          Отдых (мин)
          <input type="number" id="setBreak" value="5" min="1" max="60">
        </label>
      </div>

      <div class="pomo-controls">
        <button id="pomoStart" class="pomo-btn start">Старт</button>
        <button id="pomoReset" class="pomo-btn reset" aria-label="Сбросить таймер">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </aside>

  </div>

  <script src="app.js"></script>
</body>
</html>
